- title: Korpusanalyse. Semantische Felder und syntaktische N-Gramme
  description: In diesem Kapitel sind wir zu unserer Forschungsfrage und ihrer zweiteiligen
    Operationalisierung zurückgekehrt und haben zwei Analysen auf unseren beiden Korpora
    durchgeführt. In der Häufigkeitsanalyse des semantischen Felds „Luft“ haben wir
    für jeden Text die relative Häufigkeit luftbezogener Wörter berechnet und ihre
    Entwicklung als Streudiagramm mit Trend-Linie über die Zeit dargestellt. In der
    Analyse syntaktischer N-Gramme haben wir – aufbauend auf den Grenzen linearer
    N-Gramme – mithilfe der Dependenzannotation die Adjektive extrahiert, mit denen
    „Luft“ näher beschrieben wird, und ihre Entwicklung über die Jahrzehnte betrachtet.
  url: https://quadriga-dk.github.io/Text-Fallstudie-3/corpus_analysis/corpus-analysis_intro.html
  timeRequired: TODO
  learningGoal: TODO
  learningObjectiveLIST:
  - description: Das Konzept des semantischen Feldes kann erklärt, der Unterschied
      zwischen absoluten und relativen Häufigkeiten beschrieben und die Darstellungsmethoden
      des Streudiagramms sowie des Liniendiagramms können interpretiert werden.
    competency: TODO
    dataFlow: nicht anwendbar
    bloomsCategory: TODO
  - description: Das Konzept von syntaktischen n-Grams in Bezug auf Adjektiv-Nomen-Paare
      kann beschrieben und die notwendigen Schritte zur automatischen Extraktion der
      syntaktischen n-Grams können aufgezählt werden.
    competency: TODO
    dataFlow: nicht anwendbar
    bloomsCategory: TODO
  - description: Das Konzept einer Trend-Linie kann beschrieben und die aus einem
      Streudiagramm erzeugte Trend-Linie interpretiert werden.
    competency: TODO
