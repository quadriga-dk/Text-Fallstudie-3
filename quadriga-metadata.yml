    bloomsCategory: TODO
- title: Reflexion
  description: Wir sind in dieser Fallstudie der Frage nachgegangen, ob sich in der
    deutschsprachigen Literatur des 19. Jahrhunderts Reaktionen auf die zunehmende
    Luftverschmutzung durch die Industrialisierung ausmachen lassen. Diese haben wir
    anhand von zwei quantitativen Analysen untersucht. Erstens haben wir eine diachrone
    Häufigkeitsanalyse des semantischen Felds „Luft“ durchgeführt. Wir haben dabei
    erwartet, dass Luft über Zeit vermehrt thematisiert wird, das heißt, dass die
    Wörter des semantischen Felds häufiger vorkommen. Zweitens haben wir untersucht,
    ob sich die Semantisierung von Luft über die Zeit verändert. Dafür haben wir syntaktische
    N-Grams in Form von Adjektiv-Substantiv-Paaren analysiert, bei denen das Substantiv
    „Luft“ ist. Wir sind davon ausgegangen, dass sich die Semantisierung verändert
    und Literatur auf diese Art auf die historischen Gegebenheiten reagiert.
  url: https://quadriga-dk.github.io/Text-Fallstudie-3/reflection/reflection_reflection.html
