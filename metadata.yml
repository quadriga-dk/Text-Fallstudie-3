name: Luftqualität in deutschsprachiger Literatur des 19. Jahrhunderts. Eine Fallstudie
description: Die Open Educational Resource untersucht am Beispiel deutschsprachiger
  Literatur des 19. Jahrhunderts aus dem Corpus of German-Language Fiction, wie literarische
  Texte die abnehmende Luftqualität diskursivieren. Dazu werden eine Forschungsfrage
  entwickelt und operationalisiert, ein zeitlich balanciertes Korpus zusammengestellt,
  mit spaCy annotiert und mit Frequenz- und syntaktischen N-Gramm-Analysen ausgewertet.
